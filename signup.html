<html>
    <meta charset="UTF-8"/>
    <head>
        <title>Registrazione</title>
        <script>
            function validaRegistrazione(elementoModulo) {
                if (elementoModulo.nome.value == "") {
                    alert("Devi inserire il tuo nome!");
                    elementoModulo.nome.focus();
                    return false;
                }
                if (elementoModulo.username.value == "") {
                    alert("Devi scegliere un username!");
                    elementoModulo.username.focus();
                    return false;
                }
                if (elementoModulo.password.value == "") {
                    alert("Devi scegliere una password!");
                    elementoModulo.password.focus();
                    return false;
                }
                if (elementoModulo.conferma_password.value == "") {
                    alert("Devi confermare la password!");
                    elementoModulo.conferma_password.focus();
                    return false;
                }
                if (elementoModulo.password.value != elementoModulo.conferma_password.value) {
                    alert("Le password non corrispondono!");
                    elementoModulo.conferma_password.value = "";
                    elementoModulo.conferma_password.focus();
                    return false;
                }
                return true;
            }
        </script>
        <link rel="stylesheet" type="text/css" href="signup.css"/>
        <link rel="icon" type="icon" href="resources/logo.png"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
    <body>
        <header>
            <h1>Unisciti al Club!</h1>
        </header>   
        <main>
            <div class="signup">
                <h2>Crea un account</h2>
                <form method="post" action="signup-manager.php" onsubmit="return validaRegistrazione(this)">
                    <div class="form">
                        <input type="text" name="nome" id="nome" class="text" placeholder="Nome completo"/>
                        <i class="fa-solid fa-id-card"></i>
                        <div class="l1"><hr/></div>
                        <input type="text" name="username" id="username" class="text" placeholder="Scegli Username"/>
                        <i class="fa-solid fa-user"></i>
                        <div class="l2"><hr/></div>
                        <input type="password" name="password" id="password" class="text" placeholder="Password"/>
                        <i class="fa-solid fa-key"></i>
                        <div class="l3"><hr/></div>
                        <input type="password" name="conferma_password" id="conferma_password" class="text" placeholder="Conferma Password"/>
                        <i class="fa-solid fa-check-double"></i>
                        <div class="l4"><hr/></div>
                        <div class="submit"><input type="submit" name="registra" value="Registrati" class="button"/></div>
                    </div>
                </form>

                <div class="account">Hai già un account?
                    <input type="button" name="login" value="Accedi" onclick="window.location.href='login.html'" class="button"/>
                </div>
            </div>
            <img src="resources/logo.png" class="logo"/>
        </main>
        <footer>
            <div id="footer-box">
                <p>© 2026 - The Bowler Club - Pascariello Vincenzo, Pellecchia Simone, Turi Martina - Bowlers G21</p>
            </div>
        </footer>
    </body>
</html>
